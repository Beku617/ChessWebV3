  <text x="1663" y="690" text-anchor="middle" class="small-copy">Cloudinary media</text>
  <text x="1663" y="716" text-anchor="middle" class="small-copy">Lichess TV APIs</text>

  <rect x="62" y="516" width="190" height="182" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="85" y="540" width="144" height="50" rx="16" fill="#EAF2FF"/>
  <text x="157" y="572" text-anchor="middle" class="card-title">Static Assets</text>
  <text x="157" y="618" text-anchor="middle" class="card-copy">`public/stockfish.js`</text>
  <text x="157" y="643" text-anchor="middle" class="card-copy">images, bot avatars</text>
  <text x="157" y="668" text-anchor="middle" class="card-copy">audio cues and media</text>

