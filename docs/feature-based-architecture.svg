<svg width="1800" height="1220" viewBox="0 0 1800 1220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="240" y1="40" x2="1560" y2="1180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF"/>
      <stop offset="1" stop-color="#D8E6FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F7FBFF"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#3E5F9F" flood-opacity="0.18"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#24497E" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 58px 'Segoe UI', Arial, sans-serif; fill: #143B6B; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #47688F; }
      .panel-title { font: 700 28px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .section-title { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #11345C; }
      .card-title { font: 700 21px 'Segoe UI', Arial, sans-serif; fill: #143B6B; }
      .card-copy { font: 500 15px 'Segoe UI', Arial, sans-serif; fill: #55728F; }
      .small-copy { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #5D7693; }
      .tag { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #1A4E88; }
      .white-tag { font: 700 12px 'Segoe UI', Arial, sans-serif; fill: #FFFFFF; }
      .arrow { stroke: #1C5C9E; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
    </style>
    <marker id="arrowHead" markerWidth="10" markerHeight="10" refX="7" refY="3.5" orient="auto">
      <path d="M0 0L7 3.5L0 7" fill="none" stroke="#1C5C9E" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1800" height="1220" rx="40" fill="url(#bg)"/>

  <text x="900" y="92" text-anchor="middle" class="title">NeonGambit Feature-Based Architecture</text>
  <text x="900" y="128" text-anchor="middle" class="subtitle">Derived from the current React/Vite client, Express + Socket.IO server, and MongoDB domain model</text>

  <rect x="62" y="218" width="190" height="150" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="84" y="242" width="146" height="54" rx="16" fill="#EAF2FF"/>
  <text x="157" y="276" text-anchor="middle" class="card-title">Player / Browser</text>
  <text x="157" y="320" text-anchor="middle" class="card-copy">UI navigation</text>
  <text x="157" y="345" text-anchor="middle" class="card-copy">moves, chat, auth</text>

  <rect x="292" y="174" width="714" height="832" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="292" y="174" width="714" height="72" rx="34" fill="#1A4F87"/>
  <text x="649" y="212" text-anchor="middle" class="panel-title">Frontend SPA</text>
  <text x="649" y="236" text-anchor="middle" class="white-tag" style="font-size:16px; letter-spacing:0.4px">React 18 + Vite + TypeScript</text>

  <rect x="336" y="274" width="626" height="108" rx="24" fill="#EAF3FF" stroke="#BED2F3" stroke-width="2"/>
  <text x="649" y="310" text-anchor="middle" class="card-title">App Shell and Entry Flow</text>
  <text x="649" y="338" text-anchor="middle" class="card-copy">`src/main.tsx` + `src/App.tsx`</text>
  <text x="649" y="364" text-anchor="middle" class="card-copy">Router, lazy routes, auth guard, theme controller, active game guard, realtime bridge, i18n</text>

  <rect x="336" y="416" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="431" y="454" text-anchor="middle" class="card-title">Auth and Account</text>
  <text x="431" y="482" text-anchor="middle" class="card-copy">Login / Register</text>
  <text x="431" y="506" text-anchor="middle" class="card-copy">OAuth config + profile bootstrap</text>
  <text x="431" y="528" text-anchor="middle" class="small-copy">Routes: `/login`, `/register`</text>

  <rect x="555" y="416" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="650" y="454" text-anchor="middle" class="card-title">Play Modes</text>
  <text x="650" y="482" text-anchor="middle" class="card-copy">Quick match, bot, friend</text>
  <text x="650" y="506" text-anchor="middle" class="card-copy">variants, practice, 4-player</text>
  <text x="650" y="528" text-anchor="middle" class="small-copy">Routes: `/play/*`</text>

  <rect x="774" y="416" width="188" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="868" y="454" text-anchor="middle" class="card-title">Analysis and Replay</text>
  <text x="868" y="482" text-anchor="middle" class="card-copy">Game review, PGN replay</text>
  <text x="868" y="506" text-anchor="middle" class="card-copy">Stockfish evaluation</text>
  <text x="868" y="528" text-anchor="middle" class="small-copy">Routes: `/analyze*`</text>

  <rect x="336" y="570" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="431" y="608" text-anchor="middle" class="card-title">Puzzles and Trainer</text>
  <text x="431" y="636" text-anchor="middle" class="card-copy">Puzzle library, history</text>
  <text x="431" y="660" text-anchor="middle" class="card-copy">rated, review, random modes</text>
  <text x="431" y="682" text-anchor="middle" class="small-copy">Routes: `/puzzles*`</text>

  <rect x="555" y="570" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="650" y="608" text-anchor="middle" class="card-title">Learn and Practice</text>
  <text x="650" y="636" text-anchor="middle" class="card-copy">Courses, lessons</text>
  <text x="650" y="660" text-anchor="middle" class="card-copy">step validation + drills</text>
  <text x="650" y="682" text-anchor="middle" class="small-copy">Routes: `/learn*`</text>

  <rect x="774" y="570" width="188" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="868" y="608" text-anchor="middle" class="card-title">Tournaments and Watch</text>
  <text x="868" y="636" text-anchor="middle" class="card-copy">featured events, live games</text>
  <text x="868" y="660" text-anchor="middle" class="card-copy">Lichess TV + streamers</text>
  <text x="868" y="682" text-anchor="middle" class="small-copy">Routes: `/tournaments`, `/watch`</text>

  <rect x="336" y="724" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="431" y="762" text-anchor="middle" class="card-title">Friends and Messages</text>
  <text x="431" y="790" text-anchor="middle" class="card-copy">presence, challenges</text>
  <text x="431" y="814" text-anchor="middle" class="card-copy">conversations + attachments</text>
  <text x="431" y="836" text-anchor="middle" class="small-copy">Routes: `/friends`, `/messages`</text>

  <rect x="555" y="724" width="190" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="650" y="762" text-anchor="middle" class="card-title">Community and Social</text>
  <text x="650" y="790" text-anchor="middle" class="card-copy">posts, likes, groups</text>
  <text x="650" y="814" text-anchor="middle" class="card-copy">blocking + visibility rules</text>
  <text x="650" y="836" text-anchor="middle" class="small-copy">Routes: `/community*`</text>

  <rect x="774" y="724" width="188" height="124" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2" filter="url(#softShadow)"/>
  <text x="868" y="762" text-anchor="middle" class="card-title">Profile, Settings, Admin</text>
  <text x="868" y="790" text-anchor="middle" class="card-copy">ratings, history, theme</text>
  <text x="868" y="814" text-anchor="middle" class="card-copy">moderation and content ops</text>
  <text x="868" y="836" text-anchor="middle" class="small-copy">Routes: `/profile`, `/settings`, `/admin*`</text>

  <rect x="336" y="884" width="626" height="92" rx="24" fill="#E7F2FF" stroke="#C7DCF8" stroke-width="2"/>
  <text x="649" y="918" text-anchor="middle" class="card-title">Shared Frontend Layer</text>
  <text x="649" y="945" text-anchor="middle" class="card-copy">`src/components/*`, `src/hooks/*`, `src/store/*`, `src/chess/*`, `src/utils/*`, `src/features/*`</text>
  <text x="649" y="968" text-anchor="middle" class="small-copy">Zustand state, chess.js orchestration, browser Stockfish, theming, replay helpers, API helpers</text>

  <rect x="1064" y="174" width="482" height="832" rx="34" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="1064" y="174" width="482" height="72" rx="34" fill="#1A4F87"/>
  <text x="1305" y="212" text-anchor="middle" class="panel-title">Backend Core</text>
  <text x="1305" y="236" text-anchor="middle" class="white-tag" style="font-size:16px; letter-spacing:0.4px">Express API + Socket.IO + Mongoose</text>

  <rect x="1100" y="278" width="206" height="260" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2"/>
  <text x="1203" y="316" text-anchor="middle" class="card-title">REST API Domains</text>
  <text x="1203" y="347" text-anchor="middle" class="card-copy">`server/server/routes/*`</text>
  <text x="1203" y="376" text-anchor="middle" class="small-copy">Auth / profile / ratings</text>
  <text x="1203" y="401" text-anchor="middle" class="small-copy">History / game config / bots</text>
  <text x="1203" y="426" text-anchor="middle" class="small-copy">Puzzles / learn / tournaments</text>
  <text x="1203" y="451" text-anchor="middle" class="small-copy">Friends / messages / community</text>
  <text x="1203" y="476" text-anchor="middle" class="small-copy">Featured events / media / admin</text>
  <rect x="1140" y="495" width="126" height="26" rx="13" fill="#EAF2FF"/>
  <text x="1203" y="512" text-anchor="middle" class="tag">cookie-auth API</text>

  <rect x="1320" y="278" width="190" height="260" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2"/>
  <text x="1415" y="316" text-anchor="middle" class="card-title">Realtime Engine</text>
  <text x="1415" y="347" text-anchor="middle" class="card-copy">Socket.IO in `index.js`</text>
  <text x="1415" y="376" text-anchor="middle" class="small-copy">quick-match queue</text>
  <text x="1415" y="401" text-anchor="middle" class="small-copy">friend challenges</text>
  <text x="1415" y="426" text-anchor="middle" class="small-copy">live game rooms</text>
  <text x="1415" y="451" text-anchor="middle" class="small-copy">4-player sessions</text>
  <text x="1415" y="476" text-anchor="middle" class="small-copy">presence and reconnect handling</text>
  <text x="1415" y="501" text-anchor="middle" class="small-copy">tournament board assignment</text>

  <rect x="1100" y="572" width="410" height="180" rx="24" fill="#EAF3FF" stroke="#BED2F3" stroke-width="2"/>
  <text x="1305" y="610" text-anchor="middle" class="card-title">Domain Services and Rules</text>
  <text x="1305" y="639" text-anchor="middle" class="card-copy">`server/server/services/*`, `modules/*`, `utils/*`, `middleware/*`</text>
  <text x="1305" y="668" text-anchor="middle" class="small-copy">Glicko / Elo rating updates, tournament runtime/state machine, learn move validation</text>
  <text x="1305" y="693" text-anchor="middle" class="small-copy">email verification, media migration, request security, block/visibility policy</text>
  <text x="1305" y="718" text-anchor="middle" class="small-copy">seeding for puzzles, bots, learn content, featured events, dashboard config</text>

  <rect x="1100" y="786" width="410" height="190" rx="24" fill="#FFFFFF" stroke="#D2E0F4" stroke-width="2"/>
  <text x="1305" y="824" text-anchor="middle" class="card-title">Domain Models</text>
  <text x="1305" y="854" text-anchor="middle" class="card-copy">`server/server/models/*`</text>
  <text x="1305" y="882" text-anchor="middle" class="small-copy">Users, Admins, Friends, FriendRequests, Messages, Notifications</text>
  <text x="1305" y="907" text-anchor="middle" class="small-copy">History, History960, ActiveGameSession, RatingEvent</text>
  <text x="1305" y="932" text-anchor="middle" class="small-copy">Puzzles, attempts, stats, motifs, daily state</text>
  <text x="1305" y="957" text-anchor="middle" class="small-copy">Tournaments, games, standings, templates, transition logs</text>

