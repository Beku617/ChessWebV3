  <text x="1663" y="407" text-anchor="middle" class="small-copy">games and ratings</text>
  <text x="1663" y="430" text-anchor="middle" class="small-copy">puzzles and learning</text>
  <text x="1663" y="453" text-anchor="middle" class="small-copy">community and messaging</text>

  <rect x="1582" y="530" width="162" height="262" rx="28" fill="url(#panel)" filter="url(#shadow)"/>
  <rect x="1582" y="530" width="162" height="54" rx="28" fill="#6A9ED4"/>
